<aside class="sidebar" *ngIf="user as current">
  <div class="brand-row">
    <div class="brand">Asset Desk</div>
    <button class="icon-button ghost mobile-only" type="button" aria-label="Close menu" (click)="closeMenu.emit()">✕</button>
  </div>
  <div class="profile-mini">
    <p class="name">{{ current.name }}</p>
    <p class="muted">{{ current.email || current.phoneNumber }}</p>
    <span class="badge" [class.badge-dark]="current.role === 'manager'" [class.badge-info]="current.role === 'technician'">
      {{ current.role }}
    </span>
  </div>
  <nav class="nav">
    <button type="button" [class.active]="activeView === 'dashboard'" (click)="changeView('dashboard')">Dashboard</button>
    <button type="button" [class.active]="activeView === 'requests'" (click)="changeView('requests')">Requests</button>
    <button
      type="button"
      *ngIf="current.role === 'employee'"
      [class.active]="activeView === 'create-request'"
      (click)="changeView('create-request')"
    >
      Create request
    </button>
    <button type="button" [class.active]="activeView === 'users'" (click)="changeView('users')" *ngIf="current.role === 'manager'">
      Users
    </button>
    <button type="button" [class.active]="activeView === 'notifications'" (click)="changeView('notifications')">
      Notifications
    </button>
  </nav>
  <button class="ghost full" type="button" (click)="handleLogout()">Logout</button>
</aside>
